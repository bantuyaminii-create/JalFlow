<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Valve | JalFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="/">💧 JalFlow</a>
            <a href="{{ url_for('valves') }}" class="btn btn-outline-primary">
                Back to Valves
            </a>
        </div>
    </nav>

    <section class="dashboard-section">
        <div class="container">

            <div class="dashboard-heading text-center">
                <div class="login-icon">🔧</div>
                <h1>Edit Valve</h1>
                <p>Update valve information and operational status.</p>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-info">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="row justify-content-center">
                <div class="col-lg-7">

                    <div class="dashboard-card">

                        <form method="POST">

                            <div class="mb-3">
                                <label for="zone_id" class="form-label">
                                    Distribution Zone
                                </label>

                                <select
                                    class="form-select"
                                    id="zone_id"
                                    name="zone_id"
                                    required
                                >
                                    {% for zone in zones %}
                                        <option
                                            value="{{ zone.id }}"
                                            {% if zone.id == valve.zone_id %}selected{% endif %}
                                        >
                                            {{ zone.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="valve_code" class="form-label">
                                    Valve Code
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="valve_code"
                                    name="valve_code"
                                    maxlength="50"
                                    value="{{ valve.valve_code }}"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="location" class="form-label">
                                    Location
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="location"
                                    name="location"
                                    maxlength="150"
                                    value="{{ valve.location or '' }}"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="valve_type" class="form-label">
                                    Valve Type
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="valve_type"
                                    name="valve_type"
                                    maxlength="50"
                                    value="{{ valve.valve_type or '' }}"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="status" class="form-label">
                                    Operational Status
                                </label>

                                <select
                                    class="form-select"
                                    id="status"
                                    name="status"
                                    required
                                >
                                    <option value="active"
                                        {% if valve.status == "active" %}selected{% endif %}>
                                        Active
                                    </option>

                                    <option value="inactive"
                                        {% if valve.status == "inactive" %}selected{% endif %}>
                                        Inactive
                                    </option>

                                    <option value="maintenance"
                                        {% if valve.status == "maintenance" %}selected{% endif %}>
                                        Maintenance
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="notes" class="form-label">
                                    Notes
                                </label>

                                <textarea
                                    class="form-control"
                                    id="notes"
                                    name="notes"
                                    rows="4"
                                    maxlength="500"
                                >{{ valve.notes or '' }}</textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Save Changes
                            </button>

                            <a
                                href="{{ url_for('valves') }}"
                                class="btn btn-outline-secondary w-100 mt-2"
                            >
                                Cancel
                            </a>

                        </form>

                    </div>

                </div>
            </div>

        </div>
    </section>

</body>
</html>
