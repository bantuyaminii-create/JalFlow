<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | JalFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="/">💧 JalFlow</a>
            <a href="/" class="btn btn-outline-primary">Back to Home</a>
        </div>
    </nav>

    <section class="login-section">

        <div class="login-card">

            <div class="text-center mb-4">
                <div class="login-icon">💧</div>
                <h2>Create Account</h2>
                <p>Join the JalFlow platform</p>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-info">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/register" method="post">

                <div class="mb-3">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" class="form-control"
                           id="name" name="name"
                           placeholder="Enter your full name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-control"
                           id="email" name="email"
                           placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Account Type</label>
                    <input type="text" class="form-control" value="Resident" readonly>
                </div>

                <!-- Resident-only fields -->
                <div id="resident-fields">

                    <div class="mb-3">
                        <label class="form-label" for="zone_id">
                            Water Distribution Zone
                        </label>

                        <select class="form-select" id="zone_id" name="zone_id" required>
                            <option value="">Select your zone</option>

                            {% for zone in zones %}
                                <option value="{{ zone.id }}">
                                    {{ zone.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="address">
                            Residential Address
                        </label>

                        <textarea class="form-control"
                                  id="address"
                                  name="address"
                                  rows="3"
                                  required
                                  placeholder="Enter your residential address"></textarea>
                    </div>


                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control"
                           id="password" name="password"
                           minlength="8"
                           placeholder="At least 8 characters" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="confirmation">
                        Confirm Password
                    </label>

                    <input type="password" class="form-control"
                           id="confirmation" name="confirmation"
                           minlength="8"
                           placeholder="Enter your password again" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">
                    Create Account
                </button>

            </form>

            <p class="text-center mt-4">
                Already have an account?
                <a href="/login">Login here</a>
            </p>

        </div>

    </section>



</body>
</html>
