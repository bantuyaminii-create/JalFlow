<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Zone | JalFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">💧 JalFlow</a>
            <a href="/zones" class="btn btn-outline-primary">Back to Zones</a>
        </div>
    </nav>

    <section class="dashboard-section">
        <div class="container">

            <div class="dashboard-heading text-center">
                <div class="login-icon">🌊</div>
                <h1>Edit Water Distribution Zone</h1>
                <p>Update the zone name and description.</p>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-info">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="row justify-content-center mt-4">
                <div class="col-lg-6">

                    <div class="dashboard-card">

                        <form method="POST">

                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Zone Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    value="{{ zone.name }}"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">
                                    Description
                                </label>

                                <textarea
                                    class="form-control"
                                    id="description"
                                    name="description"
                                    rows="4"
                                >{{ zone.description or "" }}</textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Save Changes
                            </button>

                            <a href="/zones" class="btn btn-outline-secondary w-100 mt-2">
                                Cancel
                            </a>

                        </form>

                    </div>

                </div>
            </div>

        </div>
    </section>

</body>
</html>
